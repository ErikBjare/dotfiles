# Vertical tabs sidebar (Herdr-lite): sessions and windows with full titles
# and rolled-up agent state. Python 3 required. Details: ~/.tmux/vtabs.py.
#
#   prefix+Tab     focus the sidebar (showing it first if hidden); then
#                  up/down or j/k switch windows, 1-9 jump, Enter/Esc go back.
#                  Pressed again while the sidebar has focus: hide sidebars.
#   prefix+BTab    hide/show sidebars in every window (Shift+Tab)
#
#   set -g @vtabs-enabled on   # in tmux.conf before this line: start shown
#   set -g @vtabs-width 36     # sidebar columns (default 32)

# Clicks and focus changes are reported to the sidebar process itself.
set -g focus-events on

# Hidden: show and focus. Shown: focus the sidebar, the full-height leftmost
# pane, i.e. {top-left}. Already focused (the active pane is a sidebar): hide.
bind-key Tab if-shell -F '#{!=:#{@vtabs-enabled},on}' {
    run-shell -b 'python3 ~/.tmux/vtabs.py #{q:socket_path} focus'
} {
    if-shell -F '#{@vtabs}' {
        run-shell -b 'python3 ~/.tmux/vtabs.py #{q:socket_path} toggle'
    } {
        select-pane -t '{top-left}'
    }
}
bind-key BTab run-shell -b 'python3 ~/.tmux/vtabs.py #{q:socket_path} toggle'

# Every hook is a cheap no-op while disabled.
# Windows added or closed: add a sidebar, wake all sidebars (python).
set-hook -g after-new-window[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} ensure #{window_id}\""'
set-hook -g after-new-session[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} ensure #{window_id}\""'
set-hook -g pane-exited[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} tidy\""'
set-hook -g after-kill-pane[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} tidy\""'
set-hook -g window-unlinked[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} refresh\""'
set-hook -g session-renamed[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} refresh\""'
set-hook -g window-resized[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} fit\""'
# Enabling while zoomed deliberately skips splitting; fill in on unzoom.
set-hook -g after-resize-pane[7510] 'if -F "#{&&:#{==:#{@vtabs-enabled},on},#{==:#{window_zoomed_flag},0}}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} ensure #{window_id}\""'

# A window comes into view: its sidebar is already drawn (it highlights its
# own window); wake just that one to pick up title/state changes (pure tmux).
# The channel name must be quoted: a bare vtabs-#{...} is a syntax error.
set-hook -g after-select-window[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "wait-for -S \"vtabs-#{window_id}\""'
set-hook -g client-session-changed[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "wait-for -S \"vtabs-#{window_id}\""'
set-hook -g client-attached[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "wait-for -S \"vtabs-#{window_id}\""'

# tmux-resurrect: restore sidebars as sidebars, without hooks adding
# duplicates mid-restore; afterwards fill in any window still missing one.
if-shell -F '#{m:*vtabs.py*,#{@resurrect-processes}}' '' {
    set -ga @resurrect-processes ' "~vtabs.py .* render->python3 ~/.tmux/vtabs.py - render"'
}
set -g @resurrect-hook-pre-restore-all 'tmux set -g @vtabs-suspended 1'
set -g @resurrect-hook-post-restore-all 'tmux set -gu @vtabs-suspended; (sleep 3; python3 ~/.tmux/vtabs.py - ensure) >/dev/null 2>&1 &'

# Reloading the config shows sidebars again if they are enabled.
run-shell -b 'python3 ~/.tmux/vtabs.py #{q:socket_path} ensure'
