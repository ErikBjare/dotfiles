# Vertical tabs sidebar (Herdr-lite): sessions and windows with full titles
# and rolled-up agent state. prefix+Tab toggles it for the whole server.
# Python 3 required. Details: ~/.tmux/vtabs.py.
#
#   set -g @vtabs-enabled on   # in tmux.conf before this line: start shown
#   set -g @vtabs-width 36     # sidebar columns (default 32)

# Is this pane a sidebar? @vtabs is set by the renderer; the start command
# marks it from the moment it is split.
set -g @vtabs-is-sidebar '#{||:#{@vtabs},#{m:*vtabs.py*,#{pane_start_command}}}'

bind-key Tab run-shell -b 'python3 ~/.tmux/vtabs.py #{q:socket_path} toggle'

# Every hook is a cheap no-op while disabled; python runs only when needed.
set-hook -g after-new-window[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} ensure #{window_id}\""'
set-hook -g after-new-session[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} ensure #{window_id}\""'
set-hook -g pane-exited[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} tidy\""'
set-hook -g after-kill-pane[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} tidy\""'
set-hook -g window-resized[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "run-shell -b \"python3 ~/.tmux/vtabs.py #{q:socket_path} fit\""'

# Redraw now (sidebars otherwise poll once a second while visible).
set-hook -g after-select-window[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "wait-for -S vtabs"'
set-hook -g client-session-changed[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "wait-for -S vtabs"'
set-hook -g client-attached[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "wait-for -S vtabs"'
set-hook -g window-renamed[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "wait-for -S vtabs"'
set-hook -g session-renamed[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "wait-for -S vtabs"'
set-hook -g session-closed[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "wait-for -S vtabs"'
set-hook -g window-unlinked[7510] 'if -F "#{==:#{@vtabs-enabled},on}" "wait-for -S vtabs"'

# Keep focus off sidebars: pane navigation (C-h, C-left, ...) bounces back.
set-hook -g after-select-pane[7510] 'if -F "#{E:@vtabs-is-sidebar}" "last-pane"'

# Mouse: a click in a sidebar switches window/session without focusing it;
# the wheel does nothing there. Elsewhere these are tmux's default bindings.
bind-key -T root MouseDown1Pane if-shell -F '#{E:@vtabs-is-sidebar}' {
    run-shell -b 'python3 ~/.tmux/vtabs.py #{q:socket_path} click #{pane_id} #{mouse_y} #{q:client_name}'
} {
    select-pane -t = ; send-keys -M
}
bind-key -T root WheelUpPane if-shell -F '#{E:@vtabs-is-sidebar}' {} {
    if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' { send-keys -M } { copy-mode -e }
}

# tmux-resurrect: restore sidebars as sidebars, without hooks adding
# duplicates mid-restore; afterwards fill in any window still missing one.
if-shell -F '#{m:*vtabs.py*,#{@resurrect-processes}}' '' {
    set -ga @resurrect-processes ' "~vtabs.py .* render->python3 ~/.tmux/vtabs.py - render"'
}
set -g @resurrect-hook-pre-restore-all 'tmux set -g @vtabs-suspended 1'
set -g @resurrect-hook-post-restore-all 'tmux set -gu @vtabs-suspended; (sleep 3; python3 ~/.tmux/vtabs.py - ensure) >/dev/null 2>&1 &'

# Reloading the config shows sidebars again if they are enabled.
run-shell -b 'python3 ~/.tmux/vtabs.py #{q:socket_path} ensure'
