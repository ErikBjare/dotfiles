# Explicit OSC 7501 lifecycle reports, consumed via pipe-pane (not passthrough).
# Python 3 required. One small blocked reader per pane, no polling or logs.
# Existing pipe-pane users take precedence. Reload also installs on existing panes.
set-hook -g after-split-window[7501] 'run-shell -b "python3 ~/.tmux/agent-status.py --install #{q:socket_path}"'
set-hook -g after-new-window[7501] 'run-shell -b "python3 ~/.tmux/agent-status.py --install #{q:socket_path}"'
set-hook -g after-new-session[7501] 'run-shell -b "python3 ~/.tmux/agent-status.py --install #{q:socket_path}"'
run-shell -b 'python3 ~/.tmux/agent-status.py --install #{q:socket_path}'

# Roll up ALL panes in each window, not only the active pane. Priority:
# blocked > error > working > done > idle. No agent means no badge.
set -g @agent-states '#{P:#{@agent-state} }'
set -g @agent-badge '#{?#{m:*blocked*,#{E:@agent-states}},#[fg=colour221] ! ,#{?#{m:*error*,#{E:@agent-states}},#[fg=colour196] ERR ,#{?#{m:*working*,#{E:@agent-states}},#[fg=colour229] ~ ,#{?#{m:*done*,#{E:@agent-states}},#[fg=colour123] + ,#{?#{m:*idle*,#{E:@agent-states}},#[fg=colour245] . ,}}}}}'

# Per-pane detail in split borders, and the window chooser (prefix+w).
set -g pane-border-status top
set -g pane-border-format ' #P #{?@agent-state,[#{@agent-state}] ,}#{pane_title} '
bind-key w choose-tree -Zw -F '#{?window_format,#{window_name} #{E:@agent-badge},#{?pane_format,#{pane_current_command} #{?@agent-state,[#{@agent-state}],},#{session_name}}}'
