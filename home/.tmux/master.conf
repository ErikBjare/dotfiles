#########################
#          Keys         #
#########################

# Make C-a primary prefix
set -g prefix C-a

# Pane navigation
# smart pane switching with awareness of vim splits
# https://robots.thoughtbot.com/seamlessly-navigate-vim-and-tmux-splits
unbind-key -n C-up
unbind-key -n C-down
unbind-key -n C-left
unbind-key -n C-right
bind-key -n C-up     run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-k) || tmux select-pane -U"
bind-key -n C-down   run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-j) || tmux select-pane -D"
bind-key -n C-left   run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-h) || tmux select-pane -L"
bind-key -n C-right  run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-l) || tmux select-pane -R"
bind -n C-h run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-h) || tmux select-pane -L"
bind -n C-j run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-j) || tmux select-pane -D"
bind -n C-k run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-k) || tmux select-pane -U"
bind -n C-l run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys C-l) || tmux select-pane -R"
bind -n C-\\ run "(tmux display-message -p '#{pane_current_command}' | grep -iq vim && tmux send-keys 'C-\\') || tmux select-pane -l"

# Window switching
unbind-key -n F1 ;   bind-key -n F1   select-window -t :1
unbind-key -n F2 ;   bind-key -n F2   select-window -t :2
unbind-key -n F3 ;   bind-key -n F3   select-window -t :3
unbind-key -n F4 ;   bind-key -n F4   select-window -t :4
unbind-key -n F5 ;   bind-key -n F5   select-window -t :5
unbind-key -n F6 ;   bind-key -n F6   select-window -t :6
unbind-key -n F7 ;   bind-key -n F7   select-window -t :7
unbind-key -n F8 ;   bind-key -n F8   select-window -t :8
unbind-key -n F9 ;   bind-key -n F9   select-window -t :9
unbind-key -n F10;  bind-key -n F10  select-window -t :10

# Close pane with prefix + C-w (guarded; bare C-w is delete-word in the shell)
bind-key C-w kill-pane

# Reload master-conf
bind-key r source-file ~/.tmux/master.conf

# Hide/show status bar
bind-key b set status

# For same keys on both swedish and english keyboard layout
bind-key '@' split-window -v -c '#{pane_current_path}'
bind-key '"' split-window -v -c '#{pane_current_path}'
bind-key '%' split-window -h -c '#{pane_current_path}'

# Enable sending commands to a nested tmux session
bind-key C-a send-prefix

# Vim keys for copy and paste
setw -g mode-keys vi
unbind [
unbind p
bind C-y copy-mode
bind p paste-buffer

# Vim-style selection inside copy-mode (tmux 2.4+ syntax)
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

########################
#       Settings       #
########################

# Set system shell
set-option -g default-shell $SHELL

# Correct terminfo for nested apps, italics and undercurl
set -g default-terminal "tmux-256color"

# Truecolor + styled underlines are declared via terminal-features below (tmux 3.2+);
# keep only the italics enable for xterm-256color.
set -ga terminal-overrides ',xterm-256color:sitm=\E[3m:ritm=\E[23m'

set -as terminal-features ",xterm-256color:RGB:usstyle"
set -as terminal-features ",alacritty:RGB:usstyle"

# Start window indexes at 1
set -g base-index 1

# Enable mouse
set-option -g mouse on

# Renumber windows when one is deleted
set-option -g renumber-windows on

# "Aggressive resize" makes windows resize only when
# currently viewing in >=2 conflicting sessions
set -g aggressive-resize on

# View display-messages for longer
set-option -g display-time 2500

# Set window names manually
set-option -g allow-rename off

# Set bells
set -g monitor-bell on
set -g visual-bell on
set -g bell-action other

# Set proper terminal window title.
# Rich title locally: ActivityWatch categorizes on pane title (#T, e.g. Claude
# Code status) and full pane path. Compact ("window @ host") when this tmux is
# itself reached over SSH, so the outer tmux's window gets a clean nested name
# (e.g. "btop @ laptop"). $SSH_CONNECTION is read from the server environment,
# i.e. the session the tmux server was started from.
set -g set-titles on
if-shell 'test -n "$SSH_CONNECTION"' \
    'set -g set-titles-string "#W @ #h"' \
    'set -g set-titles-string "[#S:#W] #T (#{pane_current_path})"'

# Set environment variables for TPM and powerline if not already set
run-shell 'test -z "$TMUX_PLUGIN_MANAGER_PATH" && tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins" || true'
run-shell 'test -z "$POWERLINE_COMMAND" && which powerline >/dev/null 2>&1 && tmux set-environment -g POWERLINE_COMMAND "powerline" || true'

# Use Tmux Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# Continuum settings - rely on periodic saves only
set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Preserve terminal output between sessions
set -g @resurrect-capture-pane-contents 'on'

# Clean up corrupted (empty) save files on start
set-hook -g after-new-session 'run-shell "find ~/.tmux/resurrect -name \"tmux_resurrect_*.txt\" -size 0 -delete 2>/dev/null || true"'

# Status bar theme (dependency-free — applies on every host)
source ~/.tmux/theme.conf

# Use powerline if available (more robust check)
if-shell \
    'which powerline >/dev/null 2>&1' \
    "source ~/.tmux/powerline.conf" \
    ""

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if-shell \
    'test -f ~/.tmux/plugins/tpm/tpm' \
    'run ~/.tmux/plugins/tpm/tpm' \
    'display-message "TPM not found at ~/.tmux/plugins/tpm/tpm"'
