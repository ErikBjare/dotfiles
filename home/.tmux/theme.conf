# Static status bar theme — no external dependencies, works on any host.
# Powerline-dependent extras layer on top via powerline.conf (sourced conditionally).
#
# Palette:
# Blue:         colour31
# Purple/pink:  colour225
# Yellow:       colour229
# Red:          colour221
# Gray:         colour239
# Teal:         colour123

# Status bar
set -g status on
set -g status-interval 5
set -g status-fg white
set -g status-bg colour233

# Left: session name
set -g status-left-length 20
set -g status-left '#[fg=colour16,bg=white,bold] #S #[fg=white,bg=colour233,nobold] '

# Right: prefix indicator, load average, memory, hostname
# Load/mem colored by their scripts when under pressure.
# Hostname block uses the same blue as the active window so it stands out —
# makes it obvious which machine you're on when SSH'd in.
set -g status-right-length 80
set -g status-right '#{?client_prefix,#[reverse] ^A #[noreverse] ,}#[fg=colour237]#[bg=colour237,fg=white] #(~/.tmux/status-load.sh) #[fg=colour239]#[fg=white] #(~/.tmux/status-mem.sh) #[fg=colour25,bg=colour237]#[fg=white,bg=colour25,bold] #h '

# Window status line
set -g window-status-format '#[fg=colour233,bg=colour237]#[fg=white] #I #{?window_bell_flag,🔔 ,}#[fg=colour233] #[fg=white,bold]#{b:window_name}#{?window_zoomed_flag, Z,} #[fg=colour237,bg=colour233]'
set -g window-status-current-format '#[fg=colour233,bg=colour25]#[fg=white,bold] #I #{?window_bell_flag,🔔 ,}#[fg=black,nobold] #[fg=white,bold]#{b:window_name}#{?window_zoomed_flag, Z,} #[fg=colour25,bg=colour233,nobold]'

# Bell styling
set -g window-status-bell-style 'fg=colour233,bg=colour237'

# Window name: local dir normally; for ssh panes use the pane title, which the
# remote shell sets via OSC 2 (fish_title emits "dir @ host" over SSH).
set-option -g automatic-rename on
set-option -g automatic-rename-format '#{?#{==:#{pane_current_command},ssh},#{=30:pane_title},#{b:pane_current_path}}'
